name: Smoke Tests

on:
  pull_request:
    branches: [dev]

# Default: least privilege; merge job grants write. Artifacts need actions: write.
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Public repos: fork PRs must not run Playwright or merge (abuse / cost).
  reject-fork-pr:
    name: Reject fork PRs
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fork PRs cannot run workflows here
        run: |
          echo "::error::Open a branch in this repository and use a same-repo pull request. Fork PRs are not run."
          exit 1

  unit:
    name: Unit tests
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:unit

  smoke:
    name: Run smoke tests
    needs: unit
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true
      AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      AUTH_TRUST_HOST: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up database
        run: |
          mkdir -p data
          npm run db:push
          npm run db:seed

      - name: Copy test env
        run: cp tests/.env.test.example tests/.env.test

      - name: Run smoke tests (Chromium only)
        run: npx playwright test --grep @smoke --project=chromium

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  auto-merge:
    name: Auto-merge to dev
    needs: smoke
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Merge PR into dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/merge" \
            --method PUT \
            -f merge_method=merge
          BRANCH="${{ github.head_ref }}"
          BRANCH_ENC="${BRANCH//\//%2F}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_ENC}"
